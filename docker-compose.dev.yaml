services:
  api:
    container_name: hackaton-api
    build:
      context: ./apps/api
    ports:
      - "4000:4000"
    volumes:
      - ./apps/api:/app
      - /app/node_modules
      - ./apps/airflow/triggers:/opt/airflow/triggers
    env_file:
      - ./apps/api/.env
    command: npm run dev

  web:
    container_name: hackaton-web
    build:
      context: ./apps/web
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:4000
    command: npm run dev

  web-admin:
    container_name: hackaton-web-admin
    build:
      context: ./apps/web-admin
    ports:
      - "3001:3001"
    volumes:
      - ./apps/web-admin:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:4000
    command: npm run dev

  python:
    container_name: hackaton-python
    build:
      context: ./apps/python
    ports:
      - "8000:8000"
    volumes:
      - ./apps/python:/app
    env_file:
      - ./apps/api/.env
    environment:
      OLLAMA_URL: http://ollama:11434
      QWEN_MODEL: qwen3.5:0.8b
      REDIS_URL: redis://redis:6379

  airflow-postgres:
    container_name: hackaton-airflow-postgres
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  airflow-init:
    container_name: hackaton-airflow-init
    build: ./apps/airflow
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username api_user --password WEFS-RWQN-UFCH-19L9 --firstname API --lastname User --role Admin --email api@productreviver.xyz || true
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    depends_on:
      airflow-postgres:
        condition: service_healthy

  airflow-webserver:
    container_name: hackaton-airflow-webserver
    build: ./apps/airflow
    ports:
      - "8080:8080"
    volumes:
      - ./apps/airflow:/opt/airflow
      - ./apps/python:/opt/airflow/python
      - ./apps/api:/opt/airflow/api
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__PARALLELISM: 4
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: 2
      AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: 4
      AIRFLOW__API__AUTH_BACKENDS: >
        airflow.api.auth.backend.basic_auth,
        airflow.api.auth.backend.session
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: airflow webserver

  airflow-scheduler:
    container_name: hackaton-airflow-scheduler
    build: ./apps/airflow
    volumes:
      - ./apps/airflow:/opt/airflow
      - ./apps/python:/opt/airflow/python
      - ./apps/api:/opt/airflow/api
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__PARALLELISM: 4
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: 2
      AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: 4
      AIRFLOW__API__AUTH_BACKENDS: >
        airflow.api.auth.backend.basic_auth,
        airflow.api.auth.backend.session
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: airflow scheduler

  redis:
    container_name: hackaton-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    restart: unless-stopped

volumes:
  airflow-postgres-data:
  redis-data:
